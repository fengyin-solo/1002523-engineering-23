# 部署与本地共用同一份配置来源：仓库根目录 .env（模板 .env.example）。
# 这里只做容器拓扑需要的覆盖（容器内监听 0.0.0.0、前端代理走容器名）。
services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      APP_ENV: ${APP_ENV:-local}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FUSE_SEED_FILE: ${FUSE_SEED_FILE:-data/fuse-seed.json}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-8000}/api/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      # 容器间访问后端走服务名 backend，端口取同一份配置
      VITE_PROXY_TARGET: http://backend:${BACKEND_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
